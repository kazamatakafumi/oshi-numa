name: x-post

on:
  schedule:
    # 月・水・金の 20:17（日本時間）
    - cron: '17 11 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず内容だけ確認する'
        type: boolean
        default: true

permissions:
  contents: write

concurrency: x-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post
        run: node scripts/post.mjs
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Save history
        run: |
          git config user.name  "oshinuma-bot"
          git config user.email "oshinuma-bot@users.noreply.github.com"
          git add posts/state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "x-post: update history [skip ci]" && git push)
